buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        // The wrapper's android/build.gradle reads this via getExtOrDefault rather than pinning its
        // own — a library must not force its Kotlin on the app that consumes it.
        kotlinVersion = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// SPEC-070-B P1 on-branch override, mirroring the Flutter example. The gate lives HERE, in the app,
// not in the wrapper's android/build.gradle: with RN 0.76's settings plugin the APP owns dependency
// resolution, so `allprojects.repositories` declared inside a library is ignored. Learned the hard
// way on the Flutter plugin, where the identical mistake silently resolved nothing.
allprojects {
    repositories {
        if (System.getenv("APPDNA_ANDROID_SDK_PATH")) {
            // `exclusiveContent`, not a plain `mavenLocal()` listed first.
            //
            // Listing it first is not enough. Gradle consults every repository for a module until
            // one answers, and the RN toolchain's own dependencies bring in jitpack.io — declared
            // nowhere in this repo and not removable. When jitpack `Read timed out`, Gradle DISABLES
            // that repository and fails the entire configuration, reporting
            // `Could not resolve ai.appdna:sdk-android` — an artifact sitting in mavenLocal that was
            // never the problem. It happened on two consecutive runs and survived a retry, so it is
            // not a blip.
            //
            // This says `ai.appdna` is served by mavenLocal and by nothing else, so our own artifact
            // can never be the thing a third-party outage takes down.
            exclusiveContent {
                forRepository { mavenLocal() }
                filter { includeGroup "ai.appdna" }
            }
        }
    }
}
